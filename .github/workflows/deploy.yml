name: Docker Build -> Push -> Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Give permission to Maven wrapper
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # 4. Build Spring Boot JAR
      - name: Build Jar
        run: ./mvnw clean package -DskipTests

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/democicd:1.0 .

      # 7. Push image
      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/democicd:1.0

      # 8. SSH to EC2 and deploy
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop democicd || true
            docker rm democicd || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/democicd:1.0
            docker run -d \
              --name democicd \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e AWS_REGION=us-east-1 \
              ${{ secrets.DOCKERHUB_USERNAME }}/democicd:1.0
