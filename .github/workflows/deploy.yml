name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      run: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Build Jar
      run : ./mvnw clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/democicd:1.0

    - name: Push Image to Docker Hub
      run: docker push ${{secrets.DOCKERHUB_USERNAME}}/democicd:1.0

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop democicd || true
          docker rm democicd || true
          docker pull ${{secrets.DOCKERHUB_USERNAME}}/democicd:1.0
          docker run -d --name democicd -p 8080:8080 ${{secrets.DOCKERHUB_USERNAME}}/democicd:1.0
          
